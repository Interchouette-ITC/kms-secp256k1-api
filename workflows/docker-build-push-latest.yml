name: CI/CD Image 2.0

on:
  push:
    branches:
      - dev

jobs:
  nightly-build-push-latest:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Set up Make
      - name: Set up Make
        run: sudo apt-get install -y make

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build the Docker image using 'make build'
      - name: Build Docker image
        run: |
          make docker-build
          docker tag kms-secp256k1-api ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:latest

      # Step 6: Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:latest
