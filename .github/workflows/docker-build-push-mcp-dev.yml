name: CI/CD MCP Image dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "mcp/**"
      - "Makefile"
      - "docker/docker-compose.mcp.yml"
      - ".github/workflows/docker-build-push-mcp-dev.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push-mcp-dev:
    name: Build and Push kms-secp256k1-api-mcp :dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Build MCP image :dev
        run: make mcp-docker-build-dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :dev to Docker Hub
        run: make mcp-docker-push-dev-hub

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push :dev to personal GHCR
        run: make mcp-docker-push-dev-ghcr-personal

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push :dev to ghcr.io/interchouette and interchouette-itc
        run: make mcp-docker-push-dev-ghcr-itc
