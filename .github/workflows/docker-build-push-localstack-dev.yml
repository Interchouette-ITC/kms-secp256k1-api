name: CI/CD LocalStack Image dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'docker/Dockerfile-localstack'
      - 'docker/bootstrap-kms.sh'
      - '.github/workflows/docker-build-push-localstack-dev.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-push-localstack-dev:
    name: Build and Push kms-localstack :dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Build LocalStack image :dev
        run: make docker-build-localstack-dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :dev to Docker Hub
        run: make docker-push-localstack-dev-hub

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push :dev to personal GHCR
        run: make docker-push-localstack-dev-ghcr-personal

      - name: Push :dev to org GHCR
        run: make docker-push-localstack-dev-ghcr-itc
