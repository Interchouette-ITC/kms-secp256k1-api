name: CI/CD Image 2.0

# Manual only — does not run on every push to `dev`.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated image tags to push (e.g. 'dev' or 'latest 1.1.0')"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Normalize tags
        id: tags
        run: |
          TAGS=$(echo "${{ github.event.inputs.tags }}" | xargs)
          if [ -z "$TAGS" ]; then
            echo "No tags provided"
            exit 1
          fi
          PRIMARY=$(echo "$TAGS" | awk '{print $1}')
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "Pushing tags: $TAGS (build tag: $PRIMARY)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          PRIMARY="${{ steps.tags.outputs.primary }}"
          make docker-build TAG="$PRIMARY"
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker tag "kms-secp256k1-api:$PRIMARY" "kms-secp256k1-api:$tag" 2>/dev/null || true
            docker tag "kms-secp256k1-api:$PRIMARY" ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$tag"
            docker tag "kms-secp256k1-api:$PRIMARY" interchouette/kms-secp256k1-api:"$tag"
            docker tag "kms-secp256k1-api:$PRIMARY" ghcr.io/groussac/kms-secp256k1-api:"$tag"
            # docker tag "kms-secp256k1-api:$PRIMARY" ghcr.io/verqhealth/kms-secp256k1-api:"$tag"
            docker tag "kms-secp256k1-api:$PRIMARY" ghcr.io/interchouette-itc/kms-secp256k1-api:"$tag"
          done

      - name: Push Docker image to Docker Hub
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker push ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$tag"
            docker push interchouette/kms-secp256k1-api:"$tag"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image to GHCR
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            for ns in groussac interchouette-itc; do
              docker push ghcr.io/"$ns"/kms-secp256k1-api:"$tag"
            done
          done
