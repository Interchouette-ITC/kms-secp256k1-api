name: CI/CD Image 2.0

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra Docker tag to push (e.g. latest or 1.1.0). Always also pushes :dev on this workflow."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  nightly-build-push-latest:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Collect image tags
        id: tags
        run: |
          # Dev-branch builds publish :dev. Version/:latest only on explicit dispatch.
          TAGS="dev"
          EXTRA="${{ github.event.inputs.tag }}"
          if [ -n "$EXTRA" ] && [ "$EXTRA" != "dev" ]; then
            TAGS="$TAGS $EXTRA"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Pushing tags: $TAGS"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          make docker-build TAG=dev
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker tag kms-secp256k1-api:dev kms-secp256k1-api:"$tag" 2>/dev/null || true
            docker tag kms-secp256k1-api:dev ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:dev interchouette/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:dev ghcr.io/groussac/kms-secp256k1-api:"$tag"
            # docker tag kms-secp256k1-api:dev ghcr.io/verqhealth/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:dev ghcr.io/interchouette-itc/kms-secp256k1-api:"$tag"
          done

      - name: Push Docker image to Docker Hub
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker push ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$tag"
            docker push interchouette/kms-secp256k1-api:"$tag"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image to GHCR
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            for ns in groussac interchouette-itc; do
              docker push ghcr.io/"$ns"/kms-secp256k1-api:"$tag"
            done
          done
