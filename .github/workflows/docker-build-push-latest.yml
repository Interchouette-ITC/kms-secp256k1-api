name: CI/CD Image 2.0

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        default: "dev"

permissions:
  contents: read
  packages: write

jobs:
  nightly-build-push-latest:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Read Cargo version
        id: version
        run: |
          VERSION=$(awk '/^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          make docker-build
          VERSION="${{ steps.version.outputs.version }}"
          for tag in latest "$VERSION"; do
            docker tag kms-secp256k1-api:"$tag" ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:"$tag" interchouette/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:"$tag" ghcr.io/groussac/kms-secp256k1-api:"$tag"
            # docker tag kms-secp256k1-api:"$tag" ghcr.io/verqhealth/kms-secp256k1-api:"$tag"
            docker tag kms-secp256k1-api:"$tag" ghcr.io/interchouette-itc/kms-secp256k1-api:"$tag"
          done

      - name: Push Docker image to Docker Hub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker push ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/kms-secp256k1-api:"$VERSION"
          docker push interchouette/kms-secp256k1-api:latest
          docker push interchouette/kms-secp256k1-api:"$VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image to GHCR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for ns in groussac interchouette-itc; do
            docker push ghcr.io/"$ns"/kms-secp256k1-api:latest
            docker push ghcr.io/"$ns"/kms-secp256k1-api:"$VERSION"
          done
