name: Release - Build and Push Versioned Images

on:
  release:
    types: [created]

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag matches Cargo.toml
        id: extract
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected: vX.Y.Z (e.g. v1.1.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          CARGO_VERSION="$(awk '/^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Release tag version ($VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "OK: tag $TAG matches Cargo.toml $CARGO_VERSION"

  build-and-push:
    name: Build and Push Images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin kms-secp256k1-api --no-default-features --features all

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/kms-secp256k1-api

      - name: Build Docker image
        run: make docker-build TAG=latest APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :version and :latest to Docker Hub
        run: make docker-push-release-hub APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Build LocalStack Docker image
        run: make docker-build-localstack TAG=latest APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push LocalStack :version and :latest to Docker Hub
        run: make docker-push-localstack-release-hub APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push API to personal GHCR
        run: make docker-push-release-ghcr-personal APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push LocalStack to personal GHCR
        run: make docker-push-localstack-release-ghcr-personal APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Build MCP Docker image
        run: make mcp-docker-build TAG=latest MCP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push MCP :version and :latest to Docker Hub
        run: make mcp-docker-push-release-hub MCP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push MCP to personal GHCR
        run: make mcp-docker-push-release-ghcr-personal MCP_VERSION=${{ needs.validate.outputs.version }}

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push API to ghcr.io/interchouette and interchouette-itc
        run: make docker-push-release-ghcr-itc APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push LocalStack to ghcr.io/interchouette and interchouette-itc
        run: make docker-push-localstack-release-ghcr-itc APP_VERSION=${{ needs.validate.outputs.version }}

      - name: Push MCP to ghcr.io/interchouette and interchouette-itc
        run: make mcp-docker-push-release-ghcr-itc MCP_VERSION=${{ needs.validate.outputs.version }}

  summary:
    name: Summary
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Summary
        run: |
          V="${{ needs.validate.outputs.version }}"
          echo "API Hub: interchouette/kms-secp256k1-api:${V} and :latest"
          echo "API personal GHCR: ghcr.io/groussac/kms-secp256k1-api:${V} and :latest"
          echo "API worker GHCR: ghcr.io/interchouette/kms-secp256k1-api:${V} and :latest"
          echo "API org GHCR: ghcr.io/interchouette-itc/kms-secp256k1-api:${V} and :latest"
          echo "LocalStack Hub: interchouette/kms-localstack:${V} and :latest"
          echo "LocalStack personal GHCR: ghcr.io/groussac/kms-localstack:${V} and :latest"
          echo "LocalStack worker GHCR: ghcr.io/interchouette/kms-localstack:${V} and :latest"
          echo "LocalStack org GHCR: ghcr.io/interchouette-itc/kms-localstack:${V} and :latest"
          echo "MCP Hub: interchouette/kms-secp256k1-api-mcp:${V} and :latest"
          echo "MCP personal GHCR: ghcr.io/groussac/kms-secp256k1-api-mcp:${V} and :latest"
          echo "MCP worker GHCR: ghcr.io/interchouette/kms-secp256k1-api-mcp:${V} and :latest"
          echo "MCP org GHCR: ghcr.io/interchouette-itc/kms-secp256k1-api-mcp:${V} and :latest"
          echo "Attached release binary: kms-secp256k1-api"
