name: kms-secp256k1-api

on:
  push:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@v4

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0009

      - name: Check
        run: make check

      - name: Lint
        run: make lint

      - name: Unit Tests
        run: make test

      - name: Build release
        run: cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kms-secp256k1-api-binaries
          path: target/release/kms-secp256k1-api

      - name: Doc
        run: make doc

      - name: Github pages 🚀
        uses: JamesIves/github-pages-deploy-action@ba1486788b0490a235422264426c45848eac35c6 #v4.4.1
        with:
          folder: docs # The folder the action should deploy.
          target-folder: condor
          commit-message: 'Deploy documentation for ${{ github.ref_name }}'
