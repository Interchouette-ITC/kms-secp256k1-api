permissions:
  contents: write

name: kms-secp256k1-api

on:
  push:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@v5

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2026-0258

      - name: Check
        run: make check

      - name: Lint
        run: make lint

      - name: Unit Tests
        run: make test

      - name: Build release
        run: cargo build --release --no-default-features --features all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kms-secp256k1-api-binaries
          path: target/release/kms-secp256k1-api

      - name: Doc
        run: make doc

      - name: Github pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@9d877eea73427180ae43cf98e8914934fe157a1a #v4.7.6
        with:
          folder: docs/api-rust
          branch: gh-pages
          commit-message: 'Deploy documentation for ${{ github.ref_name }}'

  localstack_integration:
    name: LocalStack integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@v5

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: LocalStack integration tests
        run: make test-localstack
