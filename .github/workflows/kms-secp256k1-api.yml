permissions:
  contents: write

name: kms-secp256k1-api

on:
  push:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [dev, 'feat*', 'release-*']
    paths-ignore:
      - '**.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swatinem cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --version 0.22.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit
        run: make audit

      - name: Deny
        run: make deny

      - name: Check
        run: make check

      - name: Lint
        run: make lint

      - name: Unit Tests
        run: make test

      - name: Build release
        run: cargo build --release --no-default-features --features all

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kms-secp256k1-api-binaries
          path: target/release/kms-secp256k1-api

      - name: Doc
        run: make doc

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Github pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/api-rust
          branch: gh-pages
          commit-message: 'Deploy documentation for ${{ github.ref_name }}'

  localstack_integration:
    name: LocalStack integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swatinem cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: LocalStack integration tests
        run: make test-localstack
