name: CI/CD MCP Image release tags

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "mcp/**"
      - "Makefile"
      - "docker/docker-compose.mcp.yml"
      - ".github/workflows/docker-build-push-mcp.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push-mcp:
    name: Build and Push kms-secp256k1-api-mcp :version + :latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Read MCP version
        id: ver
        run: echo "version=$(awk '/^version = /{gsub(/"/, "", $3); print $3; exit}' mcp/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Build MCP image
        run: make mcp-docker-build TAG=latest MCP_VERSION=${{ steps.ver.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :version and :latest to Docker Hub
        run: make mcp-docker-push-release-hub MCP_VERSION=${{ steps.ver.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push to personal GHCR
        run: make mcp-docker-push-release-ghcr-personal MCP_VERSION=${{ steps.ver.outputs.version }}

      - name: Push to org GHCR
        run: make mcp-docker-push-release-ghcr-itc MCP_VERSION=${{ steps.ver.outputs.version }}
