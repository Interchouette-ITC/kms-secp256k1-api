[package]
name = "kms-secp256k1-api"
version = "0.1.0"
edition = "2024"
authors = ["gRoussac"]

[dependencies]
axum = "0.8"
k256 = { version = "0.13.4", features = ["ecdsa"] }
axum-extra = { version = "0.10.1", features = ["query"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5.3.1", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
once_cell = "1"
toml = "0.9"
hyper = "1"
regex = "1"
dotenvy = "0.15"
aws-sdk-kms = "1.72.0"
aws-types = "1.3.7"
aws-credential-types = { version = "1.2.3", features = [
  "hardcoded-credentials",
] }
aws-config = "1.6.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
base64 = { version = "0.22", features = ["alloc"] }
hex = { version = "0.4", default-features = false }
wasmtime = "*"
async-trait = "0.1.88"
casper-rust-wasm-sdk = { git = "https://github.com/casper-ecosystem/rustSDK", branch = "dev" }
ethers = "2.0.14"
rand = "*"
reqwest = "*"
cosmrs = "*"

[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
casper-types = { version = "6", git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port = { version = "1.0.0", git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port-access = { git = "https://github.com/casper-ecosystem/casper-binary-port-client", branch = "master" }

[dev-dependencies]
tower = "*"
http-body-util = "*"
serial_test = "3.2.0"
