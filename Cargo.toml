[package]
name = "kms-secp256k1-api"
version = "1.2.1"
edition = "2024"
authors = ["gRoussac"]

[features]
default = ["casper"]
casper = ["dep:casper-rust-wasm-sdk"]
ethereum = ["dep:ethers"]
cosmos = ["dep:cosmrs"]
all = ["casper", "ethereum", "cosmos"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http2",
  "tokio",
] }
k256 = { version = "0.13.4", features = [
  "ecdsa",
  "pkcs8",
  "alloc",
], default-features = false }
axum-extra = { version = "0.12.6", features = [
  "query",
], default-features = false }
tokio = { version = "1.53.1", features = ["full"], default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_json = { version = "1.0.151", default-features = false }
utoipa = { version = "5.5.0", features = [
  "axum_extras",
], default-features = false }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
], default-features = false }
once_cell = { version = "1.21.4", default-features = false }
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
] }
hyper = { version = "1.11.0", default-features = false }
regex = { version = "1.13.1", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = [
  "rt-tokio",
  "default-https-client",
] }
aws-types = { version = "1.5.0", default-features = false }
aws-credential-types = { version = "1.3.0", features = [
  "hardcoded-credentials",
], default-features = false }
aws-config = { version = "1.10.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", features = [
  "fmt",
  "env-filter",
], default-features = false }
thiserror = "2.0.19"
base64 = { version = "0.23.0", features = ["alloc"], default-features = false }
hex = { version = "0.4.3", default-features = false }
wasmtime = { version = "47.0.3", default-features = false, features = [
  "async",
  "std",
  "winch",
] }
async-trait = { version = "0.1.91", default-features = false }
casper-rust-wasm-sdk = { git = "https://github.com/casper-ecosystem/rustSDK", branch = "dev", default-features = false, optional = true }
ethers = { version = "2.0.14", default-features = false, optional = true }
rand = { version = "0.10.2", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
cosmrs = { version = "0.22.0", default-features = false, features = ["bip32"], optional = true }

[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
casper-types = { git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port = { git = "https://github.com/casper-network/casper-node", branch = "dev" }
casper-binary-port-access = { git = "https://github.com/gRoussac/casper-binary-port-client", branch = "casper_2.2.0" }

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.4"
serial_test = "4.0.1"
