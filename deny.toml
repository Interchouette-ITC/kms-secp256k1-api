# cargo-deny configuration (run: `make deny` or `cargo deny check`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
# h2 0.3 via older hyper stacks; patched releases are on h2 >= 0.4.16 only for some lines.
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "transitive h2 via hyper/reqwest stacks; 0.3 line has no 0.4.16 backport" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
