# cargo-deny configuration (run: `make deny` or `cargo deny check`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
unmaintained = "workspace"
# zip is a build-dep of utoipa-swagger-ui; v9 pins ^3, v10 pins ^8.6. Patched line is zip >=9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "utoipa-swagger-ui build-dep zip; no release accepts zip >=9 yet" },
    { id = "RUSTSEC-2026-0368", reason = "utoipa-swagger-ui build-dep zip; no release accepts zip >=9 yet" },
    { id = "RUSTSEC-2026-0369", reason = "utoipa-swagger-ui build-dep zip; no release accepts zip >=9 yet" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/casper-network/casper-node",
    "https://github.com/casper-ecosystem/casper-client-rs",
    "https://github.com/casper-ecosystem/rustSDK",
    "https://github.com/casper-ecosystem/casper-rust-wasm-sdk",
    "https://github.com/gRoussac/casper-binary-port-client",
]
