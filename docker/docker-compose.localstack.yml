# LocalStack only — no host data binds. If you add volumes, source must be
# ${KMS_HOST_ROOT}/… (never /workspace); MCP start tools require KMS_HOST_ROOT
# when KMS_API_ROOT=/workspace.
services:
  kms-localstack:
    container_name: kms-localstack
    image: ${KMS_LOCALSTACK_IMAGE:-kms-localstack:latest}
    build:
      context: .
      dockerfile: Dockerfile-localstack
    ports:
      - '4566:4566'
    environment:
      - AWS_REGION=eu-west-3
      - SERVICES=kms
      - DEBUG=0
      - LOCALSTACK_PERSISTENCE=0
      - GATEWAY_LISTEN=4566
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/kms.ready']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
