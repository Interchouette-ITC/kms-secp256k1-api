# Slim MCP sidecar (Streamable HTTP on :7790).
# Use: make mcp-http / make mcp-http-stop
#
# Host-started only (make / kms-ensure). MCP lifecycle tools never call this file.
# KMS_HOST_ROOT must be the absolute host clone path — never /workspace — so the
# daemon bind source is the real clone, not a new dir on host `/`.
services:
  kms-mcp:
    image: ${KMS_MCP_IMAGE:-kms-secp256k1-api-mcp:1.2.1}
    container_name: kms-secp256k1-api-mcp
    build:
      context: ../mcp
      dockerfile: Dockerfile
    ports:
      - "7790:7790"
    volumes:
      - ${KMS_HOST_ROOT:-${PWD}}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KMS_API_ROOT: /workspace
      KMS_HOST_ROOT: ${KMS_HOST_ROOT:-${PWD}}
      MCP_HTTP: "true"
      KMS_MCP_ADDR: "0.0.0.0:7790"
      DOCKER_HOST: unix:///var/run/docker.sock
    working_dir: /workspace
