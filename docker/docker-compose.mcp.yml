# Slim MCP sidecar (Streamable HTTP on :7790).
# Use: make mcp-http / make mcp-http-stop
services:
  kms-mcp:
    image: ${KMS_MCP_IMAGE:-kms-secp256k1-api-mcp:1.2.0}
    container_name: kms-secp256k1-api-mcp
    build:
      context: ../mcp
      dockerfile: Dockerfile
    ports:
      - "7790:7790"
    volumes:
      - ..:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KMS_API_ROOT: /workspace
      KMS_MCP_HTTP: "1"
      KMS_MCP_ADDR: "0.0.0.0:7790"
      DOCKER_HOST: unix:///var/run/docker.sock
    working_dir: /workspace
